name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVALIN }}
          project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Setup gcloud
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Setup Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy live (main)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVALIN }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Install Firebase CLI
        if: github.event_name == 'push'
        run: npm install -g firebase-tools@latest

      - name: Setup Python venv for functions
        if: github.event_name == 'push'
        run: |
          python -m venv "functions/lib/venv"
          . "functions/lib/venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r "functions/lib/requirements.txt"

      - name: Set Functions secrets (Secret Manager)
        if: github.event_name == 'push'
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NOTIFY_TO: ${{ secrets.SMTP_NOTIFY_TO }}
        run: |
          set -euo pipefail
          echo "$SMTP_USER" | firebase --project "$PROJECT_ID" functions:secrets:set SMTP_USER --data-file=- --force
          echo "$SMTP_PASSWORD" | firebase --project "$PROJECT_ID" functions:secrets:set SMTP_PASSWORD --data-file=- --force
          echo "$SMTP_NOTIFY_TO" | firebase --project "$PROJECT_ID" functions:secrets:set SMTP_NOTIFY_TO --data-file=- --force

      - name: Deploy Functions
        if: github.event_name == 'push'
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # One-time cleanup: remove legacy non-secret env vars that conflict with Secret Manager bindings.
          # (Cloud Run rejects having both a secret env var and a non-secret env var with the same name.)
          gcloud run services describe add-to-waitlist --region us-central1 --project "$PROJECT_ID" >/dev/null 2>&1 && \
            gcloud run services update add-to-waitlist \
              --region us-central1 \
              --project "$PROJECT_ID" \
              --remove-env-vars SMTP_USER,SMTP_PASSWORD,SMTP_NOTIFY_TO \
              --quiet || true

          firebase --project "$PROJECT_ID" deploy --only functions --non-interactive