name: Suivo Semantic Interruption MVP

on:
  push:
    branches:
      - chatgpt/suivo-semantic-mvp-20260822
    paths:
      - 'tools/suivo-semantic-mvp/**'
      - '.github/workflows/suivo-semantic-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'datasets>=2.20,<4' 'sentencepiece>=0.2' 'safetensors>=0.4' 'scikit-learn>=1.3' 'onnx>=1.16' 'onnxruntime>=1.18' 'accelerate>=0.33' 'protobuf<6'

      - name: Reconstruct and run trainer
        run: |
          python tools/suivo-semantic-mvp/bootstrap_train.py --out dist/suivo-semantic-mvp

      - name: Show metrics
        if: always()
        run: |
          if [ -f dist/suivo-semantic-mvp/evaluation/metrics.json ]; then cat dist/suivo-semantic-mvp/evaluation/metrics.json; fi
          find dist -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload deploy package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivo-semantic-mvp-deploy
          path: dist/suivo-semantic-mvp-deploy.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload full package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivo-semantic-mvp-full
          path: |
            dist/suivo-semantic-mvp-full.zip
            dist/suivo-semantic-mvp/evaluation/metrics.json
            dist/suivo-semantic-mvp/README.md
            dist/suivo-semantic-mvp/DATA_LICENSES.md
          compression-level: 0
          if-no-files-found: error
